name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        id: test
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Build debug APK
        id: build
        env:
          # Public values only (anon/publishable key). Set them in repo Settings > Secrets.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q AndroidManifest.xml
          unzip -l "$APK" | grep -q classes.dex
          cp "$APK" WearByAdriy-debug.apk
          sha256sum WearByAdriy-debug.apk | tee WearByAdriy-debug.apk.sha256
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then echo "NOTE: built without Supabase secrets; the app will show the setup screen." | tee -a build-note.txt; fi

      - uses: actions/upload-artifact@v4
        with:
          name: WearByAdriy-debug-apk
          path: |
            WearByAdriy-debug.apk
            WearByAdriy-debug.apk.sha256

      - name: Publish to the debug-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          NOTE="Debug build from ${GITHUB_SHA::7}. Not for the Play Store."
          if [ -f build-note.txt ]; then NOTE="$NOTE $(cat build-note.txt)"; fi
          gh release create debug-latest WearByAdriy-debug.apk WearByAdriy-debug.apk.sha256 \
            --prerelease --title "Debug build (latest)" --notes "$NOTE" --target "$GITHUB_SHA"

      - name: Save failure log
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          for f in test.log build.log; do [ -f "$f" ] && grep -E "^e: |error:|What went wrong|FAILED" "$f" | head -300 > /tmp/logs/$f.errors || true; [ -f "$f" ] && tail -200 "$f" > /tmp/logs/$f.tail || true; done
          cd /tmp/logs
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-logs
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add -A && git commit -qm "CI failure log for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
